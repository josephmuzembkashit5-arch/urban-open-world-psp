name: Build PSP Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compile PSP Game
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Configure PSP SDK
        shell: bash
        run: |
          export PSPSDK="$(psp-config --pspsdk-path)"
          echo "PSPSDK=$PSPSDK" >> "$GITHUB_ENV"
          echo "PSP SDK path: $PSPSDK"

      - name: Compile game
        shell: bash
        run: |
          make clean || true
          make

      - name: Upload PSP game
        uses: actions/upload-artifact@v4
        with:
          name: UrbanOpenWorld-PSP
          path: EBOOT.PBP
          if-no-files-found: error
